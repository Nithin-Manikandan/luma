<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUMA">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>LUMA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-mode="photo" data-fx="0">
  <header id="top">
    <button class="pill icon" id="btnGrid" aria-label="Grid"><svg viewBox="0 0 24 24"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
    <button class="pill" id="btnAspect">3:4</button>
    <button class="pill" id="btnTimer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6"/></svg><span id="timerLabel">Off</span></button>
    <button class="pill icon" id="btnTune" aria-label="Tune"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>

  <main id="stage">
    <canvas id="glow" width="24" height="32"></canvas>
    <div id="frame">
      <canvas id="view"></canvas>
      <div id="grid"></div>
      <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i>
      <div id="hud"></div>
      <div id="recPill"><b></b><span id="recTime">00:00</span></div>
      <div id="panoGuide"><div class="track"><div class="fill" id="panoFill"></div></div><span>Pan slowly &rarr;</span></div>
      <div id="focusRing"></div>
      <div id="flash"></div>
      <div id="countdown"></div>
      <div id="lensRow"></div>
      <div id="busy"><div class="spin"></div><span id="busyMsg"></span></div>
    </div>
  </main>

  <section id="tune" class="sheet">
    <div class="row"><label>Intensity</label><input type="range" id="rInt" min="0" max="100" value="100"><output></output></div>
    <div class="row"><label>Exposure</label><input type="range" id="rExp" min="-100" max="100" value="0"><output></output></div>
    <div class="row"><label>Grain</label><input type="range" id="rGrain" min="0" max="100" value="18"><output></output></div>
    <div class="row"><label>Vignette</label><input type="range" id="rVig" min="0" max="100" value="22"><output></output></div>
    <div class="row fx"><label>Depth</label><input type="range" id="rBlur" min="0" max="100" value="60"><output></output></div>
    <div class="row fx"><label>Light</label><div class="seg" id="segLight"><button data-v="0">Natural</button><button data-v="1">Studio</button><button data-v="2">Stage</button><button data-v="3">Mono</button><button data-v="4">High-key</button></div></div>
    <div class="row tl"><label>Interval</label><div class="seg" id="segTl"><button data-v="0.5">0.5s</button><button data-v="1">1s</button><button data-v="2">2s</button><button data-v="5">5s</button></div></div>
    <div class="row sm"><label>Speed</label><div class="seg" id="segSm"><button data-v="2">2&times;</button><button data-v="4">4&times;</button><button data-v="8">8&times;</button></div></div>
    <div class="row"><label>Date stamp</label><div class="seg" id="segStamp"><button data-v="0">Off</button><button data-v="1">On</button></div></div>
    <div class="row"><label>Quality</label><div class="seg" id="segQ"><button data-v="0.82">Std</button><button data-v="0.95">High</button><button data-v="1">Max</button></div></div>
  </section>

  <footer id="bottom">
    <button id="lookName">Natural</button>
    <div id="looks"></div>
    <div id="modes"></div>
    <div id="shutterRow">
      <button id="btnGallery" aria-label="Gallery"><span id="thumb"></span></button>
      <button id="shutter" aria-label="Capture"><i></i></button>
      <button id="btnFlip" class="pill icon big" aria-label="Flip"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg></button>
    </div>
  </footer>

  <div id="gate">
    <div class="logo"><svg viewBox="0 0 100 100"><g id="blades"></g><circle cx="50" cy="50" r="9" fill="#000"/></svg></div>
    <h1>LUMA</h1>
    <p id="gateMsg">Film looks. Live.</p>
    <button id="btnStart">Open Camera</button>
  </div>

  <div id="gallery" class="overlay hidden">
    <div class="ovTop"><button class="pill" id="galClose">Done</button><span id="galCount"></span><button class="pill" id="btnImport">Add LUT</button></div>
    <div id="galGrid"></div>
    <input type="file" id="cubeFile" accept=".cube" hidden multiple>
  </div>

  <div id="viewer" class="overlay hidden">
    <div class="ovTop"><button class="pill" id="vClose">Back</button><span id="vInfo"></span><button class="pill danger" id="vDel">Delete</button></div>
    <div id="vStage"></div>
    <div class="vBottom"><button class="cta" id="vSave">Save to Photos</button></div>
    <p class="hint">Photos can also be saved by touch &amp; hold</p>
  </div>
  <div id="toast"></div>
</div>
<script src="looks.js"></script>
<script src="app.js"></script>
</body>
</html>
